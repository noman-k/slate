name: Bug report
description: Something in Slate doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](https://github.com/noman-k/slate/issues) first. Security problems go through the Security tab instead, never a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - slate.noman.io
        - My own copy (self-hosted)
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 140 on macOS 26
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, or which AI client if it's about MCP. Leave out keys and private content.
