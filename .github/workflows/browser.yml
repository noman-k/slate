name: Browser workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Slate has no demo: the tests sign in to accounts on a local Supabase stack.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,postgres-meta,realtime
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
